name: Build & Publish Prebuilt Libraries

on:
  workflow_dispatch:
    inputs:
      pgmicro_ref:
        description: 'pgmicro ref (tag or branch)'
        required: true
      push_changes:
        description: 'push changes to the repo'
        required: true
        type: boolean
      nonce:
        description: 'some unique nonce'

permissions:
  contents: write

concurrency:
  group: build-libs-${{ github.event.inputs.pgmicro_ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }}${{ matrix.name_suffix || '' }}, nonce=${{ github.event.inputs.nonce }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-14
          - os: macos-15-intel
          - os: windows-latest
          # musl targets built on a glibc host via `zig cc`. Alpine
          # containers kept falling over on bindgen's libclang
          # discovery; zig ships its own bundled clang/LLVM + musl
          # headers so we can cross-compile musl from ubuntu instead.
          # See build_musl_with_zig step below.
          - os: ubuntu-latest
            musl_zig: true
            zig_target: x86_64-linux-musl
            rust_target: x86_64-unknown-linux-musl
            musl_platform: linux_amd64_musl
            name_suffix: " (musl AMD64 via zig cc)"
          - os: ubuntu-24.04-arm
            musl_zig: true
            zig_target: aarch64-linux-musl
            rust_target: aarch64-unknown-linux-musl
            musl_platform: linux_arm64_musl
            name_suffix: " (musl ARM64 via zig cc)"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean libs dir
        shell: bash
        run: rm -rf libs && mkdir -p libs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install zig (musl cross)
        if: matrix.musl_zig == true
        uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0

      - name: Build musl via zig cc
        if: matrix.musl_zig == true
        shell: bash
        run: |
          # Host libclang (ubuntu has clang + llvm-dev) handles bindgen
          # C header parsing. zig cc handles compilation + linking
          # against the target (musl) by bundling its own clang and
          # the musl sysroot.
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev findutils
          LIBCLANG_DIR=$(llvm-config --libdir)
          echo "LIBCLANG_PATH=$LIBCLANG_DIR" >> "$GITHUB_ENV"
          echo "resolved LIBCLANG_PATH=$LIBCLANG_DIR"

          # Ensure the Rust std for this target is present — the
          # dtolnay/rust-toolchain action pins tools but the `targets:`
          # list doesn't always survive to this step's PATH under the
          # default shell. Re-run idempotently.
          rustup target add ${{ matrix.rust_target }}

          # Emit two shims that front `zig cc`/`zig c++` with -target.
          # cc-rs tacks on `--target=<rust-triple>` automatically; zig
          # only understands zig-style triples (x86_64-linux-musl), so
          # we strip the cc-rs --target= arg and rely on our own
          # -target <zig-triple> which comes first.
          cat > "$RUNNER_TEMP/zig-cc.sh" <<EOF
          #!/usr/bin/env bash
          args=()
          for a in "\$@"; do
            case "\$a" in
              --target=*|-target|-target=*) ;;
              *) args+=("\$a") ;;
            esac
          done
          exec zig cc -target ${{ matrix.zig_target }} "\${args[@]}"
          EOF
          cat > "$RUNNER_TEMP/zig-cxx.sh" <<EOF
          #!/usr/bin/env bash
          args=()
          for a in "\$@"; do
            case "\$a" in
              --target=*|-target|-target=*) ;;
              *) args+=("\$a") ;;
            esac
          done
          exec zig c++ -target ${{ matrix.zig_target }} "\${args[@]}"
          EOF
          chmod +x "$RUNNER_TEMP/zig-cc.sh" "$RUNNER_TEMP/zig-cxx.sh"

          # Cargo + cc-rs env var convention: replace every non-identifier
          # char in the Rust target triple with '_'. So
          # `x86_64-unknown-linux-musl` becomes `x86_64_unknown_linux_musl`.
          ENVID=$(echo "${{ matrix.rust_target }}" | tr - _)
          TARGET_UP=$(echo "$ENVID" | tr a-z A-Z)
          export "CC_${ENVID}=$RUNNER_TEMP/zig-cc.sh"
          export "CXX_${ENVID}=$RUNNER_TEMP/zig-cxx.sh"
          export "CARGO_TARGET_${TARGET_UP}_LINKER=$RUNNER_TEMP/zig-cc.sh"
          echo "CC_${ENVID}=$RUNNER_TEMP/zig-cc.sh" >> "$GITHUB_ENV"
          echo "CXX_${ENVID}=$RUNNER_TEMP/zig-cxx.sh" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${TARGET_UP}_LINKER=$RUNNER_TEMP/zig-cc.sh" >> "$GITHUB_ENV"

          PGMICRO_BUILD_REF='${{ github.event.inputs.pgmicro_ref }}' \
          PGMICRO_LIBC_VARIANT='_musl' \
          PGMICRO_CARGO_TARGET='${{ matrix.rust_target }}' \
            bash ./build_libs.sh
          bash ./hash_libs.sh

      - name: Make script executable (POSIX)
        if: runner.os != 'Windows' && matrix.musl_zig != true
        run: chmod +x ./build_libs.sh

      - name: Build cdylib (release, glibc/macOS/Windows)
        if: matrix.musl_zig != true
        shell: bash
        run: |
          export PGMICRO_BUILD_REF=${{ github.event.inputs.pgmicro_ref }}
          ./build_libs.sh
          ./hash_libs.sh

      - name: Check after build
        shell: bash
        run: |
          echo "After build, libs/ contains:"
          find libs -maxdepth 3 -type f || true

      - name: setup go (host)
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: run test (host)
        run: |
          if [[ "${{ matrix.musl_zig }}" == "true" ]]; then
            # Only the .so/.a produced on this job is usable; Go tests
            # don't exercise the library here since go:embed would need
            # every platform bundled.
            echo "skipping host test for musl-cross artifact"
          else
            go test ./... -v
          fi
        shell: bash

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.name_suffix || '' }}
          path: libs/**/*
          if-no-files-found: error

  publish:
    name: Aggregate & PR commit
    needs: build
    # Run even if some platform builds failed (musl is a known-tricky
    # variant), as long as at least one matrix entry produced an
    # artifact. Skip only if every build was cancelled.
    if: always() && !cancelled()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to new branch
        env:
          PGMICRO_REF: ${{ github.event.inputs.pgmicro_ref }}
        shell: bash
        run: |
          set -euo pipefail

          # Determine branch name based on ref type
          BRANCH="pgmicro-branch-${PGMICRO_REF}"

          echo "Target branch: $BRANCH"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Try to fetch existing branch if present
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH exists on remote — checking it out."

            git fetch origin "$BRANCH":"$BRANCH"
            git checkout "$BRANCH"
          else
            echo "Branch $BRANCH does not exist — creating it."
            git checkout -b "$BRANCH"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: _libs_artifacts
          merge-multiple: true

      - name: Merge platform folders into repo
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p libs
          echo "Downloaded artifact roots:"
          for d in _libs_artifacts/*; do
            [ -d "$d" ] && echo " - $(basename "$d")"
          done
          for src in _libs_artifacts/*; do
            [ -d "$src" ] || continue
            plat="$(basename "$src")"
            dest="libs/$plat"
            echo "Syncing $src -> $dest"
            mkdir -p "$dest"
            rsync -a "$src"/ "$dest"/
          done

          echo "Merged libs layout:"
          for f in libs/*/*; do [ -f "$f" ] && echo "$f"; done

      - name: Skip if no libs changed
        shell: bash
        run: |
          git add -N libs || true
          if git diff --quiet -- libs ; then
            echo "No changes under libs/; skipping PR."
            exit 0
          fi

      - name: Create / update prebuilt-libs branch and push
        if: github.event.inputs.push_changes == 'true'
        shell: bash
        env:
          PGMICRO_REF: ${{ github.event.inputs.pgmicro_ref }}
        run: |
          set -euo pipefail

          BRANCH="pgmicro-branch-${PGMICRO_REF}"

          echo "Staging changes..."
          git add libs

          if git diff --cached --quiet; then
            echo "No staged changes, skipping push."
            exit 0
          fi

          git commit -m "Update prebuilt libs for ref: ${PGMICRO_REF}"

          echo "Pushing branch: $BRANCH"
          git push --set-upstream origin "$BRANCH"

          if [[ "$PGMICRO_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([\-+][0-9A-Za-z\.-]+)?$ ]]; then
            git tag "$PGMICRO_REF"
            git push --tags
          fi